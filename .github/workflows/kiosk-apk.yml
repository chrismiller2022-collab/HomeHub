# Builds the frame's kiosk app (kiosk/) and publishes it as the "kiosk-latest" release, so there's
# one fixed place to download it: Releases -> kiosk-latest -> homehub-kiosk.apk.
name: Kiosk APK

on:
  push:
    paths:
      - "kiosk/**"
      - ".github/workflows/kiosk-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME) with licenses accepted.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk homehub-kiosk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: homehub-kiosk-apk
          path: kiosk/homehub-kiosk.apk
      - name: Publish kiosk-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kiosk-latest --yes --cleanup-tag || true
          gh release create kiosk-latest homehub-kiosk.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Home Hub kiosk app (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on the frame: adb install -r homehub-kiosk.apk"
